[package]
name = "stwo-examples"
version.workspace = true
edition.workspace = true

[features]
default = []
simd = ["stwo/prover", "stwo/simd", "stwo-constraint-framework/prover", "stwo-constraint-framework/simd"]
parallel = ["dep:rayon", "stwo/parallel", "stwo-constraint-framework/parallel"]
tracing = ["stwo/tracing"]
slow-tests = []

[lib]
bench = false

[dependencies]
rayon = { workspace = true, optional = true }
num-traits.workspace = true
itertools.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
stwo = { path = "../stwo" }
stwo-constraint-framework = { path = "../constraint-framework" }
rand.workspace = true
educe.workspace = true

[dev-dependencies]
criterion = { default-features = false, features = [
    "html_reports",
], version = "0.5.1" }
ndarray = "0.16.1"
test-log = { version = "0.2.15", features = ["trace"] }

[[bench]]
harness = false
name = "poseidon"
