[workspace]
members = [
    "crates/prover",
    "crates/air-utils",
    "crates/air-utils-derive",
    "crates/constraint-framework",
    "crates/examples",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"

[workspace.dependencies]
itertools = { version = "0.12", default-features = false, features = [
    "use_alloc",
] }
blake2 = "0.10.6"
blake3 = "1.5.0"
educe = "0.5.0"
hex = "0.4.3"
num-traits = { version = "0.2.19", default-features = false }
thiserror = { version = "2.0.12" }
bytemuck = { version = "1.14.3", default-features = false }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
rayon = { version = "1.10.0", optional = false }
rand = { version = "0.8.5", default-features = false, features = ["small_rng"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
hashbrown = "0.14.0"
indexmap-nostd = "0.4.0"

[profile.bench]
codegen-units = 1
lto = true
